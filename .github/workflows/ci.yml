name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/creos_test
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: creos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
         

      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -c "select 1" >/dev/null 2>&1; then
              exit 0
            fi
            echo "Waiting for Postgres..."
            sleep 2
          done
          echo "Postgres did not become ready in time" >&2
          exit 1

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run backend migrations
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/src/config/migrations/001_event_ledger.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/src/config/migrations/002_actor_registry.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/src/config/migrations/003_phase0_hardening.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/src/config/migrations/004_evidence_enhanced.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/src/config/migrations/005_anchoring.sql

      - name: Seed regulator data
        run: npm run seed:regulator
        working-directory: backend

      - name: Run regulator tests
        run: npm run test:regulator
        working-directory: backend

      - name: Install regulator-platform dependencies
        run: npm ci
        working-directory: regulator-platform

      - name: Build regulator-platform
        run: npm run build
        working-directory: regulator-platform
